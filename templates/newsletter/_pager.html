{% if page.has_other_pages %}<div class="pager">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">&lsaquo; Newer</a>{% endif %}
  <span>Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}">Older &rsaquo;</a>{% endif %}</div>{% endif %}
