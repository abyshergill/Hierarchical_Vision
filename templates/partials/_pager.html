{% if page.has_other_pages %}<nav class="pager" aria-label="Pagination">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{{ extra }}">&lsaquo; Prev</a>{% endif %}
  <span>Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}{{ extra }}">Next &rsaquo;</a>{% endif %}</nav>{% endif %}
