<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Org Chart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/apple_theme.css') }}">
</head>
<body>
    <header>
        <div class="logo"> Org Chart</div>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search by name or Employee ID...">
        </div>
        <div id="auth-section">
            <button id="auth-btn" class="btn btn-primary">Login</button>
        </div>
    </header>

    <div id="canvas">
        <div id="breadcrumbs" class="breadcrumbs"></div>
        <div id="canvas-content"></div>
    </div>

    <div id="search-overlay" class="search-results-overlay">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Search Results</h2>
            <button id="close-search" class="btn">Close</button>
        </div>
        
        <div id="lineage-container" class="lineage-view">
            <h3>Lineage</h3>
            <div id="lineage-chain" class="lineage-chain"></div>
        </div>

        <div id="results-container">
            <h3>Employees</h3>
            <div id="results-grid" class="results-grid"></div>
        </div>
    </div>

    <!-- Modals for Auth -->
    <div id="auth-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:40px; border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,0.2); z-index:3000; width: 350px;">
        <h3>Authorized Access</h3>
        <div style="margin-bottom: 15px;">
            <label style="font-size: 12px; color: var(--text-secondary);">Admin ID</label>
            <input type="text" id="admin-id" class="search-input" placeholder="Enter ID">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="font-size: 12px; color: var(--text-secondary);">Password</label>
            <input type="password" id="admin-pass" class="search-input" placeholder="Enter Password">
        </div>
        <div style="display:flex; gap:10px;">
            <button id="login-submit" class="btn btn-primary">Login</button>
            <button id="login-cancel" class="btn">Cancel</button>
        </div>
    </div>

    <!-- Employee CRUD Modal -->
    <div id="emp-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:40px; border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,0.2); z-index:4000; width:450px;">
        <h3 id="modal-title">Add Subordinate</h3>
        <form id="emp-form">
            <input type="hidden" id="emp-id">
            <input type="hidden" id="manager-id">
            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-secondary);">Employee ID (e.g., EMP-110)</label>
                <input type="text" id="form-emp-id-str" class="search-input" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-secondary);">Full Name</label>
                <input type="text" id="form-name" class="search-input" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-secondary);">Email</label>
                <input type="email" id="form-email" class="search-input" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-secondary);">Contact Number</label>
                <input type="text" id="form-contact" class="search-input">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 12px; color: var(--text-secondary);">Profile Image (Optional)</label>
                <div style="display:flex; gap:8px;">
                    <input type="file" id="form-image-file" class="search-input" accept="image/*" style="padding: 4px;">
                    <input type="text" id="form-image-url" class="search-input" placeholder="OR URL" style="flex:1;">
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">Save Member</button>
                <button type="button" id="form-cancel" class="btn">Cancel</button>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script>
        // Global Auth State
        let isAuthorized = false;

        async function checkAuth() {
            const resp = await fetch('/api/auth/status');
            const data = await resp.json();
            isAuthorized = data.authorized;
            updateAuthUI(true); // pass true to skip re-init if already handled
        }

        function updateAuthUI(skipInit = false) {
            const authSection = document.getElementById('auth-section');
            if (isAuthorized) {
                authSection.innerHTML = `
                    <span class="admin-badge">Admin</span> 
                    <button id="logout-btn" class="btn" style="margin-left:10px">Logout</button>
                `;
                document.getElementById('logout-btn').onclick = logout;
            } else {
                authSection.innerHTML = '<button id="auth-btn" class="btn btn-primary">Login</button>';
                document.getElementById('auth-btn').onclick = () => document.getElementById('auth-modal').style.display = 'block';
            }
            if (!skipInit && typeof initCanvas === 'function') initCanvas();
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            isAuthorized = false;
            updateAuthUI();
        }

        document.getElementById('login-cancel').onclick = () => document.getElementById('auth-modal').style.display = 'none';
        
        document.getElementById('login-submit').onclick = async () => {
            const id = document.getElementById('admin-id').value;
            const password = document.getElementById('admin-pass').value;
            const resp = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password })
            });
            const data = await resp.json();
            if (data.success) {
                isAuthorized = true;
                updateAuthUI();
                document.getElementById('auth-modal').style.display = 'none';
            } else {
                alert('Invalid Credentials');
            }
        };

        // Initialize only once
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            if (typeof initCanvas === 'function') initCanvas();
        });
    </script>
</body>
</html>
